<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login - MINAMO HOMESTAY</title>
  
  <style>
  * { box-sizing: border-box; }
  body {
    font-family: sans-serif;
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #f1f5f9;
    padding: 20px;
    color: #0f172a;
  }
  .login-wrapper {
    width: 100%;
    max-width: 420px;
  }
  .login-card {
    width: 100%;
    background: #ffffff;
    border-radius: 12px;
    padding: 28px 22px;
    box-shadow: 0 10px 25px rgba(15, 23, 42, 0.08);
    text-align: center;
  }
  .brand-tag {
    display: inline-block;
    background: #dbeafe;
    color: #1d4ed8;
    font-size: 12px;
    font-weight: bold;
    padding: 5px 12px;
    border-radius: 999px;
    margin-bottom: 10px;
    letter-spacing: 0.5px;
  }
  .login-header h2 {
    margin: 0;
    font-size: 24px;
    letter-spacing: 0.8px;
    color: #0f172a;
  }
  .login-header p {
    margin: 8px 0 22px;
    color: #475569;
    font-size: 14px;
    line-height: 1.4;
  }
  .form-group {
    text-align: left;
    margin-bottom: 14px;
  }
  .form-group label {
    display: block;
    font-size: 13px;
    font-weight: bold;
    color: #334155;
    margin-bottom: 6px;
  }
  .form-group input {
    width: 100%;
    padding: 11px 12px;
    font-size: 14px;
    color: #0f172a;
    background: #f8fafc;
    border: 1px solid #cbd5e1;
    border-radius: 8px;
    outline: none;
    transition: border-color 0.15s ease, background 0.15s ease;
  }
  .form-group input:focus {
    border-color: #2563eb;
    background: #ffffff;
  }
  .pesan-error {
    min-height: 18px;
    margin: 6px 0 12px;
    font-size: 13px;
    font-weight: bold;
    color: #dc2626;
    text-align: left;
  }
  .btn-login {
    width: 100%;
    padding: 11px 14px;
    border: none;
    border-radius: 8px;
    font-size: 14px;
    font-weight: bold;
    color: #ffffff;
    background: #2563eb;
    cursor: pointer;
    transition: background 0.15s ease, transform 0.15s ease;
  }
  .btn-login:hover {
    background: #1d4ed8;
    transform: translateY(-1px);
  }
  .btn-login:disabled {
    background: #94a3b8;
    cursor: not-allowed;
    transform: none;
  }
  .footer-note {
    width: 100%;
    margin-top: 22px;
    text-align: center;
    font-size: 12px;
    color: #64748b;
    line-height: 1.6;
  }
</style>

</head>
<body>
  <div class="login-wrapper">
    <div class="login-card">
      <div class="login-header">
		<div class="brand-tag">SISTEM MANAJEMEN HOTEL TERPADU</div>
			<h2>MINAMO HOMESTAY</h2>
			<p>Masuk ke Sistem Manajemen MINAMO</p>
		</div>

      <form id="formLogin" onsubmit="prosesLogin(event)">
        <div class="form-group">
          <label for="login_user">Username</label>
          <input
            type="text"
            id="login_user"
            name="user"
            placeholder="Masukkan user..."
            autocomplete="username"
            required
          />
        </div>

        <div class="form-group">
          <label for="login_pswd">Password</label>
          <input
            type="password"
            id="login_pswd"
            name="pswd"
            placeholder="Masukkan password..."
            autocomplete="current-password"
            required
          />
        </div>

        <div id="pesanError" class="pesan-error" role="alert"></div>

        <button type="submit" id="btnLogin" class="btn-login">Masuk</button>
      </form>

      <p class="footer-note">
        MINAMO HOMESTAY<br />
        Copyright @FCHFAISAL
      </p>
    </div>
  </div>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyiC918_2zY1MuNdjTVqX8bjZ4esYuUU9bi9fzHb8PDawLqueE9rJtg0bBB_aSHYQEC_w/exec";
    const STORAGE_KEY_SESSION = "minamo_login_session";
    const STORAGE_KEY_RECEPTIONIST = "minamo_receptionist_name";

    function ambilSesiAktif() {
      try {
        const mentah = sessionStorage.getItem(STORAGE_KEY_SESSION) || localStorage.getItem(STORAGE_KEY_SESSION);
        if (!mentah) return null;
        const sesi = JSON.parse(mentah);
        if (sesi && sesi.loggedIn === true && sesi.user) {
          return sesi;
        }
      } catch (err) {
        console.warn("Gagal membaca sesi login:", err);
      }
      return null;
    }

    function simpanSesiAktif(namaUser) {
      const dataSesi = {
        loggedIn: true,
        user: String(namaUser || "").trim(),
        loginAt: new Date().toISOString()
      };
      const stringSesi = JSON.stringify(dataSesi);
      sessionStorage.setItem(STORAGE_KEY_SESSION, stringSesi);
      localStorage.setItem(STORAGE_KEY_SESSION, stringSesi);
      localStorage.setItem(STORAGE_KEY_RECEPTIONIST, dataSesi.user);
    }

    function arahkanKeMenuUtama() {
      window.location.href = "menu.html";
    }

    function ekstrakDaftarUser(payload) {
      if (!payload) return [];
      if (Array.isArray(payload)) return payload;
      if (Array.isArray(payload.user)) return payload.user;
      if (Array.isArray(payload.users)) return payload.users;
      if (Array.isArray(payload.User)) return payload.User;
      if (payload.data && Array.isArray(payload.data.user)) return payload.data.user;
      return [];
    }

    async function ambilDataUserDariServer() {
      const res = await fetch(`${SCRIPT_URL}?action=all`, { cache: "no-store" });
      if (!res.ok) {
        throw new Error(`HTTP Status: ${res.status}`);
      }
      const data = await res.json();
      return ekstrakDaftarUser(data);
    }

    async function prosesLogin(event) {
      event.preventDefault();

      const inputUserEl = document.getElementById("login_user");
      const inputPswdEl = document.getElementById("login_pswd");
      const pesanErrorEl = document.getElementById("pesanError");
      const btnLoginEl = document.getElementById("btnLogin");

      const userInput = String(inputUserEl.value || "").trim();
      const pswdInput = String(inputPswdEl.value || "");

      pesanErrorEl.textContent = "";

      if (!userInput || !pswdInput) {
        pesanErrorEl.textContent = "User dan password wajib diisi.";
        return;
      }

      btnLoginEl.disabled = true;
      btnLoginEl.textContent = "Memeriksa...";

      try {
        const daftarUser = await ambilDataUserDariServer();

        const akunCocok = daftarUser.find(item => {
          const kolomUser = String(item.user ?? item.username ?? "").trim();
          const kolomPswd = String(item.pswd ?? item.password ?? "");
          return kolomUser === userInput && kolomPswd === pswdInput;
        });

        if (!akunCocok) {
          pesanErrorEl.textContent = "User atau password tidak sesuai.";
          btnLoginEl.disabled = false;
          btnLoginEl.textContent = "Masuk";
          inputPswdEl.focus();
          return;
        }

        const namaTervalidasi = String(akunCocok.user ?? userInput).trim();
        simpanSesiAktif(namaTervalidasi);
        arahkanKeMenuUtama();
      } catch (err) {
        console.error(err);
        pesanErrorEl.textContent = `Gagal memverifikasi login: ${err.message}`;
        btnLoginEl.disabled = false;
        btnLoginEl.textContent = "Masuk";
      }
    }

    // Jika sudah memiliki sesi aktif saat login.html dibuka, langsung arahkan ke menu.html di tab yang sama
    if (ambilSesiAktif()) {
      arahkanKeMenuUtama();
    }
  </script>
</body>
</html>
